name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # Use npm install (not ci) so a stale lockfile never blocks the build.
        run: npm install

      - name: Generate Prisma client
        # Generates the Prisma client type stubs — does NOT connect to a database.
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        # Inject required NEXT_PUBLIC_ Firebase vars so the client bundle can be
        # built. Real secrets (GEMINI_API_KEY, FIREBASE_SERVICE_ACCOUNT_JSON,
        # AUTH_SECRET, DATABASE_URL) are set in the deployment host's env panel
        # and are NOT needed here — the build only needs the public Firebase
        # config and a dummy AUTH_SECRET to pass the startup check.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          # Dummy value — only needed to pass the getAuthSecret() startup check.
          # Real value is set in the deployment host's environment variables.
          AUTH_SECRET: "ci-build-only-not-a-real-secret-replace-in-deploy"
          # Skip Prisma DB connection during build.
          DATABASE_URL: "postgresql://skip:skip@localhost:5432/skip"
          AI_PROVIDER: "local"
        run: npx next build
